name: CI

on:
  push:
    branches: [main, 'integrate/*']
  pull_request:
    branches: [main, 'integrate/*']
  workflow_dispatch:

jobs:
  test:
    name: Testes e validacao de sintaxe
    runs-on: ubuntu-latest

    steps:
      - name: Fazer checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Validar sintaxe dos scripts
        run: |
          node --check script.js
          node --check projetos/beauty-store/script.js
          node --check projetos/beauty-store/sanitize.js

      - name: Rodar os testes
        run: node --test projetos/seu-manoel/booking-rules.test.mjs projetos/beauty-store/sanitize.test.mjs